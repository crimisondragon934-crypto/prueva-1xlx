name: prueva_1xlx_llm
description: Native local LLM app for Android 12 (8GB RAM) with llama.cpp and RAG context training.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  fllama: ^0.0.12
  file_picker: ^8.0.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
